name: Docs CI
# Every pull request and every push to main or develop runs the full
# publication gate: em dashes, facts, links, private terms, and a real build.
# Everything runs on the organization self-hosted runners with pinned
# actions and read-only permissions; no publishing token is ever exposed to
# pull requests.
on:
  pull_request:
  push:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Certified self-hosted capacity, not RunsOn. This gate is light Node work
    # with no container and no browser, so the standard fleet runs it in
    # seconds. It used to ask RunsOn for an EC2 Spot host, and on 2026-09-01
    # that control plane stopped placing instances: the run sat queued for
    # six hours with no runner ever registered, which blocks publication on
    # something the documentation gate does not need.
    runs-on: [self-hosted, linux, x64, universe-linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@8e24bc760556caa5ec8c7c497baaad2e9adcc912 # v1 # v1
      - name: Publication gate
        run: node tools/check-docs.mjs
      - name: Build the House Manual
        run: node site/build.mjs
      - name: The built site carries no em dash and no private term either
        run: |
          set -euo pipefail
          if grep -rl "$(printf '\xe2\x80\x94')" _site; then
            echo "em dash escaped into the built site" >&2
            exit 1
          fi
  facts-live:
    # Only trusted refs compare against production, so a fork PR cannot make
    # this repository hammer the live product.
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, universe-linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@8e24bc760556caa5ec8c7c497baaad2e9adcc912 # v1 # v1
      # Two outcomes, two meanings. A mismatch is documentation drift and must
      # never publish. Unreachable means a runner could not open a socket to
      # the product, which says nothing about the facts and used to block the
      # publication of correct documentation while the site served an older
      # build. The facts stay guarded either way: the verify job in this same
      # workflow runs the publication gate, which pins every one of them
      # offline without touching the network.
      - name: Documented facts match the live product contract
        run: |
          set +e
          node tools/check-facts-live.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          if [ "$status" -eq 75 ]; then
            echo "::warning title=Live product contract unreachable::Published without re-checking the live contract. facts/facts.json is still pinned offline by the publication gate, which ran and passed. Re-run this workflow when the endpoint is reachable to restore the live comparison."
            exit 0
          fi
          exit "$status"
