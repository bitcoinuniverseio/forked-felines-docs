name: Publish the House Manual
# Main publishes the immutable Pages artifact already verified on develop.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
  pages: write
concurrency:
  group: docs-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, universe-super]
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Publish the verified exact-SHA Pages artifact
        id: deployment
        run: node tools/deploy-verified-pages.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
