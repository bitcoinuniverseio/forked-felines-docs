name: Publish the House Manual
# Publishes GitHub Pages from main only, after the same gate CI enforces.
# The Pages deployment runs in the github-pages environment, so the
# publishing credential never exists on any other ref.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: [self-hosted, universe-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@e2a4530be8c5d42e23ed7c198300d05d775ddeb0 # v1
      - name: Publication gate
        run: node tools/check-docs.mjs
      # Two outcomes, two meanings. A mismatch is documentation drift and must
      # never publish. Unreachable means a runner could not open a socket to
      # the product, which says nothing about the facts and used to block the
      # publication of correct documentation while the site served an older
      # build. The facts stay guarded either way: the publication gate above
      # pins every one of them offline and has already run.
      - name: Documented facts match the live product contract
        run: |
          set +e
          node tools/check-facts-live.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          if [ "$status" -eq 75 ]; then
            echo "::warning title=Live product contract unreachable::Published without re-checking the live contract. facts/facts.json is still pinned offline by the publication gate, which ran and passed. Re-run this workflow when the endpoint is reachable to restore the live comparison."
            exit 0
          fi
          exit "$status"
      - name: Build the House Manual
        run: node site/build.mjs
        env:
          DOCS_SITE_ORIGIN: https://docs.forkedfelines.art
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: [self-hosted, universe-ci]
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
