<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="addr-title addr-desc" font-family="Palatino Linotype, Palatino, Georgia, serif">
  <title id="addr-title">Receiving address and payment address</title>
  <desc id="addr-desc">Two separate flows. Left: any wallet you choose pays the exact quoted total to the house payment address printed on the bill. Right: the house delivers the Feline to the receiving address you named, and that same address is checked against the Knot Heads snapshot for credits. The paying wallet and the receiving address never need to be the same.</desc>
  <rect width="920" height="360" fill="#f6efdd"/>
  <rect x="6" y="6" width="908" height="348" fill="none" stroke="#3a2a1d" stroke-width="4"/>
  <text x="460" y="46" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="4" fill="#6f5420">TWO ADDRESSES, TWO JOBS</text>
  <!-- left: payment -->
  <g>
    <rect x="60" y="90" width="180" height="70" fill="#efe5cc" stroke="#3a2a1d" stroke-width="3"/>
    <text x="150" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#221c14">ANY WALLET</text>
    <text x="150" y="140" text-anchor="middle" font-size="12" fill="#4c4232">the one that pays</text>
    <path d="M150 160 L150 220" stroke="#6e1f24" stroke-width="3" marker-end="url(#arrow-ox)"/>
    <text x="162" y="196" font-size="12" fill="#6e1f24" font-weight="700">exact total, once</text>
    <rect x="60" y="228" width="180" height="70" fill="#6e1f24" stroke="#a87b2f" stroke-width="3"/>
    <text x="150" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#f6efdd">PAYMENT ADDRESS</text>
    <text x="150" y="278" text-anchor="middle" font-size="12" fill="#ecdcb0">printed on the signed bill</text>
  </g>
  <!-- middle: the house -->
  <g>
    <rect x="370" y="150" width="180" height="90" fill="#16211a" stroke="#b98d43" stroke-width="4"/>
    <text x="460" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#ecdcb0" letter-spacing="2">THE HOUSE</text>
    <text x="460" y="208" text-anchor="middle" font-size="12" fill="#b98d43">verifies payment, inscribes,</text>
    <text x="460" y="224" text-anchor="middle" font-size="12" fill="#b98d43">delivers</text>
    <path d="M240 263 C300 263 320 210 368 200" stroke="#6e1f24" stroke-width="3" fill="none" marker-end="url(#arrow-ox)"/>
    <path d="M552 195 C620 190 640 150 678 132" stroke="#1c2a20" stroke-width="3" fill="none" marker-end="url(#arrow-forest)"/>
    <text x="612" y="212" text-anchor="middle" font-size="12" fill="#1c2a20" font-weight="700">the Feline, on chain</text>
  </g>
  <!-- right: receiving -->
  <g>
    <rect x="680" y="90" width="180" height="70" fill="#1c2a20" stroke="#b98d43" stroke-width="3"/>
    <text x="770" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#ecdcb0">RECEIVING ADDRESS</text>
    <text x="770" y="140" text-anchor="middle" font-size="12" fill="#b98d43">the one you named</text>
    <path d="M770 160 L770 220" stroke="#a87b2f" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-brass)"/>
    <rect x="680" y="228" width="180" height="70" fill="#efe5cc" stroke="#3a2a1d" stroke-width="3"/>
    <text x="770" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#221c14">GUEST LIST CHECK</text>
    <text x="770" y="272" text-anchor="middle" font-size="11.5" fill="#4c4232">Knot Heads at block 963,238</text>
    <text x="770" y="288" text-anchor="middle" font-size="11.5" fill="#4c4232">read-only, credits applied</text>
  </g>
  <text x="460" y="334" text-anchor="middle" font-size="12.5" font-style="italic" fill="#4c4232">They may be the same address. They never have to be.</text>
  <defs>
    <marker id="arrow-ox" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#6e1f24"/></marker>
    <marker id="arrow-forest" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#1c2a20"/></marker>
    <marker id="arrow-brass" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#a87b2f"/></marker>
  </defs>
</svg>
